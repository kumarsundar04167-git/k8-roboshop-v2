apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mongodb
spec:
  ports:
  - protocol: TCP
    port: 27017
    targetport: 27017
  clusterIP: None # Defines this as a Headless Service
  selector:
    project: roboshop
    tier: db
    component: mongodb
---

apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mongodb
spec:
  ports:
  - protocol: TCP
    port: 27017
    targetport: 27017
  selector:
    project: roboshop
    tier: db
    component: mongodb

---


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mongodb
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mongodb # Must match .spec.template.metadata.labels
  serviceName: "mongodb-headless" # Binds to the Headless Service above
  replicas: 1 # Spawns web-0, web-1, and web-2
  minReadySeconds: 10
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mongodb
    spec:
      containers:
      - name: mongodb
        image: sundarkumar135/mongodb:4.0.0
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  volumeClaimTemplates: # Automatically creates unique PVCs for each Pod
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs" # Replace with your cluster's StorageClass
      resources:
        requests:
          storage: 1Gi
