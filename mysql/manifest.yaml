apiVersion: v1
kind: ConfigMap
metadata:
    name: mysql
    namespace: roboshop
data:
  MYSQL_ROOT_PASSWORD: RoboShop@1

----

apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  ports:
  - protocol: TCP
    port: 3306
    targetport: 3306
  clusterIP: None # Defines this as a Headless Service
  selector:
    project: roboshop
    tier: db
    component: mysql
---

apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  ports:
  - protocol: TCP
    port: 3306
    targetport: 3306
  selector:
    project: roboshop
    tier: db
    component: mysql

---


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: mysql
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: mysql # Must match .spec.template.metadata.labels
  serviceName: "mysql-headless" # Binds to the Headless Service above
  replicas: 1 # Spawns web-0, web-1, and web-2
  minReadySeconds: 10
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: mysql
    spec:
      containers:
      - name: mysql
        image: sundarkumar135/mysql:4.0.0
        args: ["--mysql-native-password=ON"]
        envFrom:
        - configMapRef:
            name: mysql
        volumeMounts:
        - name: mysql
          mountPath: /var/lib/mysql
  volumeClaimTemplates: # Automatically creates unique PVCs for each Pod
  - metadata:
      name: mysql
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs" # Replace with your cluster's StorageClass
      resources:
        requests:
          storage: 1Gi
