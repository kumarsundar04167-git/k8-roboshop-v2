apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: rabbitmq
spec:
  ports:
  - protocol: TCP
    port: 5672
    targetport: 5672
  clusterIP: None # Defines this as a Headless Service
  selector:
    project: roboshop
    tier: db
    component: rabbitmq
---

apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: rabbitmq
spec:
  ports:
  - protocol: TCP
    port: 5672
    targetport: 5672
  selector:
    project: roboshop
    tier: db
    component: rabbitmq

---


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    tier: db
    component: rabbitmq
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: db
      component: rabbitmq 
  serviceName: "rabbitmq-headless" # Binds to the Headless Service above
  replicas: 1 # Spawns web-0, web-1, and web-2
  minReadySeconds: 10
  template:
    metadata:
      labels:
        project: roboshop
        tier: db
        component: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: sundarkumar135/rabbitmq:3.0.0
        volumeMounts:
        - name: rabbitmq
          mountPath: /var/lib/rabbitmq
  volumeClaimTemplates: # Automatically creates unique PVCs for each Pod
  - metadata:
      name: rabbitmq
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs" # Replace with your cluster's StorageClass
      resources:
        requests:
          storage: 1Gi
