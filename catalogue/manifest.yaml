apiVersion: apps/v1
kind: Configmap
metadata:
   name: catalogue
   namespace: roboshop
data:
   MONGO: "true"
   MONGO_URL: "mongodb://mongodb:27017/catalogue"

---

apiVersion: apps/v1
kind: Deployment
metadata:
   name: catalogue
   namespace: roboshop
   labels:
     project: roboshop
     tier: backend
     component: catalogue
spec:
   replicas: 1
   selector:
      matchLabels:
        project: roboshop
        tier: backend
        component: catalogue
   template:
      metadata:
        labels:
            project: roboshop
            tier: backend
            component: catalogue
      spec:
        containers:
          - name: catalogue
            image: sundarkumar135/catalogue:4.0.0
            resources:
              requests:
                 cpu: "100m"
                 memory: "128mi"
              limits:
                 requests:
                   cpu: "100m"
                   memory: "128mi"
            envFrom:
              - configmapRef:
                   name: catalogue

---

apiVersion: apps/v1
kind: Service
metadata:
   name: catalogue
   namespace: roboshop
   labels:
     project: roboshop
     tier: backend
     component: catalogue
spec:
  selector:
      project: roboshop
      tier: backend
      component: catalogue
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
